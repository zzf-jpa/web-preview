<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图文视频记录表</title>
  <style>
    * {box-sizing: border-box;font-family: system-ui, sans-serif;margin:0;padding:0;}
    body {padding:16px;background:#f5f7fa;max-width:1200px;margin:0 auto;}
    .top-bar {margin-bottom:16px;}
    button {padding:8px 16px;background:#3671e9;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:15px;}
    .row-wrap {background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:start;}
    textarea,input {width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
    textarea {min-height:80px;resize:vertical;}
    .img-preview {min-height:80px;border:1px solid #ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa;}
    .img-preview img {max-width:100%;max-height:180px;object-fit:contain;}
    .del-btn {background:#ee4444;margin-top:8px;}
    .tip {color:#666;font-size:13px;margin:8px 0;}
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>文字｜图片｜视频链接 记录</h2>
    <p class="tip">每一行三列：左侧文字、中间粘贴图片链接自动预览、右侧填视频链接</p>
    <button onclick="addRow()">➕新增一行</button>
  </div>
  <div id="container"></div>

<script>
// 读取本地存储
let data = JSON.parse(localStorage.getItem('listData')) || [];
const container = document.getElementById('container');

// 渲染全部行
function render(){
  container.innerHTML = '';
  data.forEach((item,idx)=>{
    const div = document.createElement('div');
    div.className='row-wrap';
    div.innerHTML = `
      <div>
        <textarea placeholder="在这里输入文字内容" onchange="saveData()">${item.text||''}</textarea>
      </div>
      <div>
        <input type="text" placeholder="粘贴图片URL" value="${item.imgUrl||''}" onchange="saveData();render()">
        <div class="img-preview">
          ${item.imgUrl?`<img src="${item.imgUrl}" onerror="this.parentElement.innerHTML='图片加载失败'">`:'粘贴图片链接'}
        </div>
      </div>
      <div>
        <input type="text" placeholder="粘贴视频链接" value="${item.videoUrl||''}" onchange="saveData()">
        <button class="del-btn" onclick="deleteRow(${idx})">删除本行</button>
      </div>
    `
    container.appendChild(div);
  })
}

// 新增空行
function addRow(){
  data.push({text:'',imgUrl:'',videoUrl:''})
  saveData();render();
}

// 删除一行
function deleteRow(index){
  data.splice(index,1);
  saveData();render();
}

// 保存到浏览器本地
function saveData(){
  localStorage.setItem('listData', JSON.stringify(data));
}

render();
</script>
</body>
</html>
